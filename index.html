<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GMAT Practice Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<style>
/* VOICE: clinical, calm, exam-room — nothing competes with the question.
   IDEA: the Pearson test-centre screen: a dark rail with clock and counter, white answer sheet below.
   PICTURE: the live question itself; on results, the big score and difficulty bars.
   COLOUR and TYPE: deep green rail #00463c, lime-white clock, coral for time-pressure and misses; Inter Tight + Inter.
   LAYOUT: one column on phones; passage | question split above 900px; sticky action footer. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f1513);--ink:light-dark(#14201c,#e8efe9);--mut:light-dark(#5b6b65,#9fb0a8);--line:light-dark(#dfe5e2,#26332e);--soft:light-dark(#f3f6f4,#16201c);--pri:light-dark(#00463c,#2c8a69);--ok:light-dark(#1d7a4f,#6fd19b);--bad:light-dark(#c8371e,#ff8a75);--rail:#00463c;--lime:#e6f5c8;--coral:#ff6f59}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,.big{font-family:"Inter Tight",Inter,sans-serif;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,40px)}h2{font-size:22px;margin:32px 0 12px}
.bar{position:sticky;top:0;z-index:5;background:var(--rail);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(4vw,14px);min-height:56px;flex-wrap:wrap}
.brand{font:700 17px "Inter Tight",sans-serif;letter-spacing:.01em}
#hud{display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums}
.clock{background:transparent;border:1px solid #ffffff40;color:var(--lime);font:700 18px "Inter Tight",sans-serif;border-radius:8px;padding:6px 12px;min-height:40px;cursor:pointer;white-space:nowrap}
.clock.warn{color:#fff;background:var(--coral);border-color:var(--coral)}
.cnt{color:#ffffffcc;white-space:nowrap;font-size:15px}
.wrap{max-width:1000px;margin:0 auto;padding:clamp(24px,4vw,48px) max(5vw,16px) 64px}
.lede{color:var(--mut);margin:10px 0 24px;max-width:60ch}
.mut{color:var(--mut)}.small{font-size:14px}.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
button{font:inherit;min-height:44px;border-radius:10px;padding:0 18px;cursor:pointer;border:1px solid transparent}
button:focus-visible,label:focus-within,textarea:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.pri{background:var(--pri);color:#fff;font-weight:600}.pri:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.link{background:none;border:0;padding:0;min-height:0;color:var(--pri);text-decoration:underline;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.drop{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:14px;padding:28px;min-height:190px;text-align:center;cursor:pointer;background:var(--soft)}
.drop.over{border-color:var(--pri)}.drop input{position:absolute;opacity:0;width:1px;height:1px}
.paste{display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:136px;border:1px solid var(--line);border-radius:12px;padding:12px;font:14px/1.45 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--ink);resize:vertical}
.err{margin-top:16px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);font-weight:500}
.card{border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:20px;background:var(--bg)}
.resume{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;border-color:var(--pri)}.resume>div:first-child{display:flex;flex-direction:column}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{background:var(--soft);border-radius:99px;padding:4px 12px;font-size:14px}
.rules{margin:12px 0 18px;padding-left:20px;color:var(--mut)}.rules li{margin:4px 0}
details{margin-top:20px}summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.hist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 4px;color:var(--ink)}
/* question */
.q{max-width:1240px;margin:0 auto;padding:20px max(4vw,16px) 120px}
.q.split{display:grid;gap:28px}
@media(min-width:900px){.q.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.q.split .stim{max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:76px;padding-right:12px}}
.q:not(.split) .ask{max-width:760px;margin:0 auto}
.stim{border-bottom:1px solid var(--line);padding-bottom:20px}@media(min-width:900px){.q.split .stim{border-bottom:0;border-right:1px solid var(--line);padding-bottom:0}}
.passage{font-size:16px;line-height:1.7}
.qtype{font-size:14px;color:var(--mut);margin-bottom:10px}
.stem{font-size:17px;line-height:1.65;margin-bottom:14px}
.stmts{list-style:none;padding:0;margin:0 0 18px}.stmts li{margin:8px 0;padding-left:2.4em;text-indent:-2.4em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:52px}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .let{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:15px}
.opt.on{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 8%,transparent)}.opt.on .let{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.lock{opacity:.55;cursor:not-allowed}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px max(4vw,14px) max(10px,env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;z-index:4}
.note{color:var(--mut);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{font-weight:600;font-size:14px;color:var(--mut)}
.dt th{cursor:pointer;white-space:nowrap}.dt caption{text-align:left;font-weight:600;margin-bottom:6px}
/* review */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:10px;margin:20px 0}
.rq{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:64px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:0;font-weight:600}
.rq .s{font-size:12px;color:var(--mut);font-weight:500}.rq.bm{border-color:var(--coral)}.rq.ch{background:var(--soft)}
/* results */
.score{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,48px);align-items:center;margin:16px 0 8px}
@media(max-width:600px){.score{grid-template-columns:1fr}}
.big{font-size:clamp(64px,14vw,112px);color:var(--pri);font-variant-numeric:tabular-nums}.big small{font-size:.4em;color:var(--mut)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;border-top:1px solid var(--line)}
.figs div{padding:12px 12px 12px 0;border-bottom:1px solid var(--line)}.figs b{display:block;font:700 22px "Inter Tight",sans-serif;font-variant-numeric:tabular-nums}.figs span{font-size:14px;color:var(--mut)}
.bars{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:110px 1fr 120px;gap:12px;align-items:center;font-size:15px}
@media(max-width:600px){.brow{grid-template-columns:84px 1fr 92px;font-size:14px}}
.track{height:14px;background:var(--soft);border-radius:99px;overflow:hidden}.fill{height:100%;background:var(--pri);border-radius:99px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.slow{color:var(--coral);font-weight:600}
.copybar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:24px 0 8px;padding:16px;border-radius:14px;background:var(--soft)}
.exp{border-top:1px solid var(--line);padding:14px 0}.exp h3{font-size:16px;margin:0 0 6px}
pre,.scroll{overflow-x:auto}code{overflow-wrap:anywhere}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.fill{transition:width .6s ease}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script></head><body>
<header class="bar"><div class="brand">GMAT Practice Room</div><div id="hud"></div></header>
<main id="app"></main>
<template id="promptTpl">Act as my GMAT tutor. Give me 23 GMAT Focus–standard questions on: [TOPIC(S)]. Use real past-GMAT style (official-guide level). Mix difficulty: about 5 Easy, 9 Medium, 6 Hard, 3 Very Hard.
Return ONLY valid JSON (no commentary) in exactly this format:
{
  "title": "Quant – Number Properties + Rates",
  "section": "Quant",
  "timeLimitMinutes": 45,
  "questions": [
    {
      "id": "Q1",
      "type": "PS",
      "topic": "Number Properties",
      "subtopic": "Divisibility",
      "difficulty": "Medium",
      "passage": "",
      "question": "If \\( n^2 \\) is divisible by 72, ...",
      "statements": [],
      "options": ["6", "12", "24", "36", "48"],
      "answer": "B",
      "explanation": "Short worked solution."
    }
  ]
}
Rules: type is PS, DS, CR, RC or DI. "answer" is one letter A–E. DS questions: put the two statements in "statements" and leave "options" empty. RC and CR stimulus text goes in "passage". DI tables: add "table": {"headers": [...], "rows": [[...]]}. Write math as \\( ... \\) (double backslash inside JSON). Include a concise explanation for every question.</template>
<script>
{
const L='ABCDE';
const DS_OPTS=['Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.','Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.','BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.','EACH statement ALONE is sufficient.','Statements (1) and (2) TOGETHER are NOT sufficient.'];
const TYPES={PS:'Problem Solving',DS:'Data Sufficiency',CR:'Critical Reasoning',RC:'Reading Comprehension',DI:'Data Insights',TA:'Table Analysis',GI:'Graphics Interpretation',MSR:'Multi-Source Reasoning',TPA:'Two-Part Analysis'};
const DIFF=['Easy','Medium','Hard','Very Hard'];
const KEY='gmat-room-session-v1',HIST='gmat-room-history-v1';
const app=document.getElementById('app'),hud=document.getElementById('hud');
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const fmt=sec=>{sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')};
const tex=()=>{try{window.MathJax&&MathJax.typesetPromise&&MathJax.typesetPromise([app]).catch(()=>{})}catch(e){}};
const armed={};
const arm=(k,btn,txt)=>{if(armed[k]&&Date.now()-armed[k]<4000){armed[k]=0;return true}armed[k]=Date.now();const o=btn.textContent;btn.textContent=txt;setTimeout(()=>{if(btn.isConnected)btn.textContent=o},4000);return false};
const SAMPLE={title:'Sample – mixed Quant & Verbal',section:'Mixed',timeLimitMinutes:10,questions:[
{id:'Q1',type:'PS',topic:'Number Properties',subtopic:'Divisibility',difficulty:'Medium',question:'If \\( n \\) is a positive integer and \\( n^2 \\) is divisible by 72, what is the largest positive integer that must divide \\( n \\)?',options:['6','12','24','36','48'],answer:'B',explanation:'\\( 72 = 2^3 \\cdot 3^2 \\). For \\( n^2 \\) to contain \\( 2^3 \\), \\( n \\) needs at least \\( 2^2 \\); for \\( 3^2 \\), \\( n \\) needs 3. So \\( n \\) must be a multiple of 12.'},
{id:'Q2',type:'DS',topic:'Algebra',subtopic:'Quadratics',difficulty:'Medium',question:'What is the value of \\( x \\)?',statements:['\\( x^2 - 5x + 6 = 0 \\)','\\( x \\) is a prime number greater than 2.'],answer:'C',explanation:'(1) gives x = 2 or 3: not sufficient. (2) allows any odd prime: not sufficient. Together x = 3.'},
{id:'Q3',type:'PS',topic:'Counting',subtopic:'Inclusion–exclusion',difficulty:'Hard',question:'How many positive integers less than 1,000 are divisible by neither 5 nor 7?',options:['672','685','686','700','714'],answer:'C',explanation:'Multiples of 5: 199; of 7: 142; of 35: 28. Divisible by 5 or 7: 199 + 142 − 28 = 313. Answer: 999 − 313 = 686.'},
{id:'Q4',type:'CR',topic:'Critical Reasoning',subtopic:'Weaken',difficulty:'Medium',passage:'After the town of Arden installed speed cameras along Main Street, the number of traffic accidents on Main Street fell by 30 percent over the following year. The town council concluded that the cameras caused the decline.',question:'Which of the following, if true, most seriously weakens the council\'s conclusion?',options:['Speed cameras are costly for the town to maintain.','In the same year, a newly opened bypass diverted most truck traffic away from Main Street.','Accident rates in nearby towns without speed cameras rose slightly that year.','Most Arden residents say they support the cameras.','The cameras were placed at the three intersections with the most accidents.'],answer:'B',explanation:'B offers an alternative cause for the decline, so the cameras need not be responsible.'},
{id:'Q5',type:'RC',topic:'Reading Comprehension',subtopic:'Inference',difficulty:'Hard',passage:'Most flowering plants release pollen passively, but some, such as the tomato, have anthers that release pollen only when vibrated at particular frequencies, a process known as buzz pollination. Honeybees cannot produce these vibrations; bumblebees can. Greenhouse tomato growers, who long relied on workers who vibrated each flower by hand with electric wands, began importing commercial bumblebee colonies in the late 1980s. The shift reduced labor costs substantially, although some ecologists warn that colonies escaping from greenhouses may compete with native pollinators.',question:'It can be inferred from the passage that, before the late 1980s, greenhouse tomato growers',options:['relied mainly on honeybees to pollinate their crops','spent money on labor to release pollen that the flowers would not otherwise release efficiently','did not know that tomato flowers require vibration to release pollen','imported native bumblebee species from other regions','were criticized by ecologists for their pollination methods'],answer:'B',explanation:'Growers paid workers to vibrate flowers by hand, and the switch to bumblebees cut labor costs.'}]};

let S=store.get(KEY),pending=null,timer=null,hideClock=false,ticks=0;
const save=()=>{if(S&&S.phase!=='done')store.set(KEY,S)};

function normalize(raw){
  let d=raw;
  if(typeof raw==='string'){const t=raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');try{d=JSON.parse(t)}catch(e){throw Error('That isn’t valid JSON: '+e.message)}}
  if(Array.isArray(d))d={questions:d};
  if(!d||!Array.isArray(d.questions)||!d.questions.length)throw Error('No "questions" array found in the JSON.');
  const qs=d.questions.map((q,i)=>{
    const type=String(q.type||'PS').toUpperCase();
    let st=Array.isArray(q.statements)&&q.statements.length?q.statements.map(String):null;
    let opts=Array.isArray(q.options||q.choices)&&(q.options||q.choices).length?(q.options||q.choices):null;
    if(!opts&&(type==='DS'||st))opts=DS_OPTS;
    if(!opts||opts.length<2)throw Error(`Question ${i+1}: needs an "options" array.`);
    opts=opts.slice(0,5).map(o=>String(o).replace(/^\s*\(?[A-E][\).:]\s+/,''));
    const ans=String(q.answer??q.correct??'').toUpperCase().replace(/[^A-E]/g,'').charAt(0);
    if(!ans||L.indexOf(ans)>=opts.length)throw Error(`Question ${i+1}: "answer" must be a letter A–${L[opts.length-1]}.`);
    return{id:String(q.id??`Q${i+1}`),type,topic:String(q.topic||''),subtopic:String(q.subtopic||''),difficulty:String(q.difficulty||'Medium'),source:String(q.source||''),passage:String(q.passage||q.stimulus||''),table:q.table&&Array.isArray(q.table.rows)?q.table:null,question:String(q.question||q.prompt||''),statements:st,options:opts,answer:ans,explanation:String(q.explanation||'')};
  });
  return{title:String(d.title||'GMAT practice set'),section:String(d.section||''),timeLimitMinutes:Math.max(1,+d.timeLimitMinutes||45),questions:qs};
}

function tableHTML(t){
  return`<div class="scroll"><table class="dt">${t.caption?`<caption>${esc(t.caption)}</caption>`:''}<thead><tr>${(t.headers||[]).map((h,i)=>`<th data-act="sort" data-c="${i}">${esc(h)} ↕</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

/* ---------- load screen ---------- */
function renderLoad(err){
  stopTick();hud.innerHTML='';
  const hist=store.get(HIST)||[],live=S&&S.phase!=='done';
  app.innerHTML=`<div class="wrap">
  <h1>Load a practice section</h1>
  <p class="lede">Upload or paste the JSON Claude gives you. You get exam rules: one question at a time, a running clock, and a review screen with up to 3 answer edits.</p>
  ${live?`<div class="card resume"><div><b>${esc(S.test.title)}</b><span class="mut small">In progress · question ${S.idx+1} of ${S.test.questions.length} · ${fmt((S.endAt-Date.now())/1000)} left</span></div><div class="row"><button class="pri" data-act="resume">Resume</button><button class="ghost" data-act="discard">Discard</button></div></div>`:''}
  <div class="grid2" style="margin-top:20px">
    <label class="drop" id="drop"><input type="file" id="file" accept=".json,application/json,text/plain"><b>Upload a .json file</b><span class="mut small">Tap to choose, or drop it here</span></label>
    <div class="paste"><textarea id="txt" spellcheck="false" placeholder='Or paste the JSON here: { "title": …, "questions": [ … ] }'></textarea><button class="pri" data-act="paste">Load pasted JSON</button></div>
  </div>
  <div id="err" class="err" ${err?'':'hidden'}>${esc(err||'')}</div>
  <div id="prev"></div>
  <p class="mut small" style="margin-top:18px">No test yet? <button class="link" data-act="sample">Load the 5-question sample</button></p>
  <details><summary>Prompt to get a test from Claude</summary><p class="mut small">Copy this into any chat, replace the topic, then paste Claude’s JSON above.</p><textarea id="prompt" readonly style="min-height:220px"></textarea><div class="row" style="margin-top:10px"><button class="ghost" data-act="copyPrompt">Copy prompt</button></div></details>
  ${hist.length?`<h2>Past attempts</h2><div class="hist">${hist.map((h,i)=>`<button class="hrow" data-act="hist" data-i="${i}"><span>${esc(h.report.title)}<br><span class="mut small">${esc(new Date(h.report.takenAt).toLocaleString())}</span></span><span class="num">${fmt(h.report.timeUsedSec)}</span><span class="num"><b>${h.report.score.correct}/${h.report.score.total}</b></span></button>`).join('')}</div>`:''}
  </div>`;
  document.getElementById('prompt').value=document.getElementById('promptTpl').innerHTML.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  const f=document.getElementById('file'),drop=document.getElementById('drop');
  const readFile=file=>{if(!file)return;const r=new FileReader();r.onload=()=>loadData(String(r.result));r.onerror=()=>showErr('Could not read that file.');r.readAsText(file)};
  f.addEventListener('change',()=>readFile(f.files[0]));
  drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
  drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
  drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');readFile(e.dataTransfer.files[0])});
}
function showErr(m){const e=document.getElementById('err');if(e){e.hidden=!m;e.textContent=m||''}}
function loadData(raw){
  try{pending=normalize(raw)}catch(e){pending=null;showErr(e.message);document.getElementById('prev').innerHTML='';return}
  showErr('');
  const t=pending,n=t.questions.length,c={},dc={};
  t.questions.forEach(q=>{c[q.type]=(c[q.type]||0)+1;dc[q.difficulty]=(dc[q.difficulty]||0)+1});
  const p=document.getElementById('prev');
  p.innerHTML=`<div class="card"><h2 style="margin:0 0 4px">${esc(t.title)}</h2><div class="mut">${esc(t.section)}${t.section?' · ':''}${n} questions · ${t.timeLimitMinutes} minutes · about ${fmt(t.timeLimitMinutes*60/n)} per question</div>
  <div class="chips">${Object.entries(c).map(([k,v])=>`<span class="chip">${esc(TYPES[k]||k)} × ${v}</span>`).join('')}${Object.entries(dc).map(([k,v])=>`<span class="chip">${esc(k)} × ${v}</span>`).join('')}</div>
  <ul class="rules"><li>You must answer each question to move on; you can’t go back during the section.</li><li>Bookmark anything you want to revisit. After the last question you can review and change up to 3 answers.</li><li>The clock keeps running if you leave the page. At 0:00 the section ends and unanswered questions count as wrong.</li></ul>
  <button class="pri" data-act="start">Start the ${t.timeLimitMinutes}-minute section</button></div>`;
  p.scrollIntoView({behavior:'smooth',block:'start'});
}
function start(){
  const now=Date.now(),n=pending.questions.length;
  S={test:pending,idx:0,phase:'test',view:'q',answers:Array(n).fill(null),times:Array(n).fill(0),bookmarks:Array(n).fill(false),orig:null,startAt:now,endAt:now+pending.timeLimitMinutes*60000,qStart:now};
  pending=null;save();render();startTick();
}

/* ---------- clock ---------- */
function startTick(){stopTick();timer=setInterval(tick,500);tick()}
function stopTick(){if(timer)clearInterval(timer);timer=null}
function tick(){
  if(!S||S.phase==='done')return stopTick();
  const rem=(S.endAt-Date.now())/1000;
  if(rem<=0)return finish(true);
  const c=document.getElementById('clock');
  if(c){c.textContent=hideClock?'Show time':fmt(rem);c.classList.toggle('warn',rem<300&&!hideClock)}
  if(++ticks%10===0)save();
}
function stamp(){if(S.qStart!=null)S.times[S.idx]+=(Date.now()-S.qStart)/1000;S.qStart=null}

/* ---------- test ---------- */
function render(){
  if(!S||S.phase==='done')return renderLoad();
  const n=S.test.questions.length;
  hud.innerHTML=`<span class="cnt">${S.phase==='review'?'Review':`Question ${S.idx+1} of ${n}`}</span><button class="clock" id="clock" data-act="clock" aria-label="Time remaining"></button>`;
  if(S.phase==='review'&&S.view==='list')renderReview();else renderQ();
  tick();window.scrollTo(0,0);
}
const edits=()=>S.orig?S.answers.filter((a,i)=>a!==S.orig[i]).length:0;
function renderQ(){
  const q=S.test.questions[S.idx],a=S.answers[S.idx],n=S.test.questions.length,rev=S.phase==='review';
  const locked=rev&&edits()>=3&&a===S.orig[S.idx];
  const stim=q.passage||q.table;
  app.innerHTML=`<div class="q ${stim?'split':''}">
  ${stim?`<section class="stim">${q.passage?`<div class="passage">${rich(q.passage)}</div>`:''}${q.table?tableHTML(q.table):''}</section>`:''}
  <section class="ask"><div class="qtype">${esc(TYPES[q.type]||q.type)}</div>
  <div class="stem">${rich(q.question)}</div>
  ${q.statements?`<ol class="stmts">${q.statements.map((s,i)=>`<li><b>(${i+1})</b>&nbsp; ${rich(s.replace(/^\s*\(?\d\)\s*/,''))}</li>`).join('')}</ol>`:''}
  <div class="opts" role="radiogroup">${q.options.map((o,i)=>`<label class="opt ${a===L[i]?'on':''} ${locked&&a!==L[i]?'lock':''}"><input type="radio" name="o" value="${L[i]}" ${a===L[i]?'checked':''} ${locked&&a!==L[i]?'disabled':''}><span class="let">${L[i]}</span><span>${rich(o)}</span></label>`).join('')}</div>
  </section></div>
  <div class="foot"><button class="ghost" data-act="bm">${S.bookmarks[S.idx]?'★ Bookmarked':'☆ Bookmark'}</button>
  ${rev?`<span class="note">${locked?'You’ve used all 3 edits':`${3-edits()} edit${3-edits()===1?'':'s'} left`}</span><button class="pri" data-act="back">Back to review</button>`
  :`<button class="pri" id="next" data-act="next" ${a?'':'disabled'}>${S.idx===n-1?'Finish section':'Next'}</button>`}</div>`;
  app.querySelectorAll('input[name=o]').forEach(r=>r.addEventListener('change',()=>{
    S.answers[S.idx]=r.value;save();
    app.querySelectorAll('.opt').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));
    if(rev)renderQ();else document.getElementById('next').disabled=false;
  }));
  tex();
}
function renderReview(){
  const qs=S.test.questions;
  app.innerHTML=`<div class="wrap"><h1>Review your answers</h1>
  <p class="lede">Tap a question to revisit it. You can change up to 3 answers in total (${3-edits()} left). Time spent here counts against the clock and toward that question.</p>
  <div class="row"><span class="chip">★ ${S.bookmarks.filter(Boolean).length} bookmarked</span><span class="chip">${edits()} changed</span></div>
  <div class="rgrid">${qs.map((q,i)=>`<button class="rq ${S.bookmarks[i]?'bm':''} ${S.answers[i]!==S.orig[i]?'ch':''}" data-act="open" data-i="${i}">${i+1}<span class="s">${S.bookmarks[i]?'★ ':''}${esc(S.answers[i]||'—')}</span></button>`).join('')}</div>
  <button class="pri" data-act="end">End section</button></div>`;
}
function finish(timedOut){
  stopTick();stamp();
  S.phase='done';S.finishedAt=Math.min(Date.now(),S.endAt);S.timedOut=!!timedOut;
  const report=buildReport();
  const hist=store.get(HIST)||[];hist.unshift({report,test:S.test});store.set(HIST,hist.slice(0,15));store.del(KEY);
  renderResults(report,S.test);
}

/* ---------- report ---------- */
function buildReport(){
  const qs=S.test.questions,n=qs.length,limit=S.test.timeLimitMinutes*60;
  const rows=qs.map((q,i)=>({n:i+1,id:q.id,type:q.type,topic:q.topic,subtopic:q.subtopic,difficulty:q.difficulty,yourAnswer:S.answers[i],correctAnswer:q.answer,correct:S.answers[i]===q.answer,timeSec:Math.round(S.times[i]),bookmarked:S.bookmarks[i],changedInReview:!!(S.orig&&S.answers[i]!==S.orig[i])}));
  const group=k=>{const g={};rows.forEach(r=>{const key=r[k]||'Other';g[key]=g[key]||{total:0,correct:0,timeSec:0};g[key].total++;g[key].correct+=r.correct?1:0;g[key].timeSec+=r.timeSec});for(const v of Object.values(g)){v.accuracy=Math.round(100*v.correct/v.total);v.avgTimeSec=Math.round(v.timeSec/v.total)}return g};
  const correct=rows.filter(r=>r.correct).length;
  return{app:'GMAT Practice Room',version:1,title:S.test.title,section:S.test.section,takenAt:new Date(S.startAt).toISOString(),timeLimitSec:limit,timeUsedSec:Math.round((S.finishedAt-S.startAt)/1000),timedOut:S.timedOut,targetPaceSec:Math.round(limit/n),answered:rows.filter(r=>r.yourAnswer).length,score:{correct,total:n,accuracy:Math.round(100*correct/n)},byDifficulty:group('difficulty'),byType:group('type'),byTopic:group('topic'),questions:rows};
}
function renderResults(R,test){
  stopTick();hud.innerHTML='';
  const pace=R.targetPaceSec,slow=R.questions.filter(r=>r.timeSec>pace*1.5).length;
  const avg=Math.round(R.questions.reduce((s,r)=>s+r.timeSec,0)/R.score.total);
  const dk=Object.keys(R.byDifficulty).sort((a,b)=>{const r=k=>{const i=DIFF.indexOf(k);return i<0?99:i};return r(a)-r(b)});
  const top=window.self===window.top;
  app.innerHTML=`<div class="wrap">
  <div class="mut">${esc(R.title)} · ${esc(new Date(R.takenAt).toLocaleString())}</div>
  <div class="score"><div class="big">${R.score.correct}<small>/${R.score.total}</small></div>
  <div class="figs"><div><b>${R.score.accuracy}%</b><span>accuracy</span></div><div><b>${fmt(R.timeUsedSec)}</b><span>of ${fmt(R.timeLimitSec)} used${R.timedOut?' · ran out':''}</span></div><div><b>${fmt(avg)}</b><span>avg per question (target ${fmt(pace)})</span></div><div><b>${slow}</b><span>slow questions (over ${fmt(pace*1.5)})</span></div></div></div>
  <div class="copybar"><button class="pri" data-act="copy">Copy report for Claude</button>${top?'<button class="ghost" data-act="dl">Download .json</button>':''}<button class="ghost" data-act="home">New test</button><span class="note" id="cmsg">Paste the report into chat for a breakdown and the next set.</span></div>
  <h2>By difficulty</h2><div class="bars">${dk.map(k=>{const v=R.byDifficulty[k];return`<div class="brow"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${v.accuracy}%"></div></div><span class="num">${v.correct}/${v.total} · ${fmt(v.avgTimeSec)}</span></div>`}).join('')}</div>
  <h2>By topic</h2><table class="stack"><thead><tr><th>Topic</th><th class="num">Correct</th><th class="num">Accuracy</th><th class="num">Avg time</th></tr></thead><tbody>${Object.entries(R.byTopic).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v.correct}/${v.total}</td><td class="num">${v.accuracy}%</td><td class="num">${fmt(v.avgTimeSec)}</td></tr>`).join('')}</tbody></table>
  <h2>Every question</h2><table class="stack"><thead><tr><th>#</th><th>Topic</th><th>Difficulty</th><th>Yours</th><th>Correct</th><th>Result</th><th class="num">Time</th></tr></thead><tbody>${R.questions.map(r=>`<tr><td>${r.n}${r.bookmarked?' ★':''}</td><td>${esc(r.topic)}${r.subtopic?` <span class="mut">· ${esc(r.subtopic)}</span>`:''}</td><td>${esc(r.difficulty)}</td><td>${esc(r.yourAnswer||'—')}${r.changedInReview?' <span class="mut">(changed)</span>':''}</td><td>${esc(r.correctAnswer)}</td><td class="${r.correct?'ok':'bad'}">${r.correct?'Right':r.yourAnswer?'Wrong':'Unanswered'}</td><td class="num ${r.timeSec>pace*1.5?'slow':''}">${fmt(r.timeSec)}</td></tr>`).join('')}</tbody></table>
  <details><summary>Questions and explanations</summary>${test.questions.map((q,i)=>{const r=R.questions[i];return`<div class="exp"><h3>${i+1}. <span class="${r.correct?'ok':'bad'}">${r.correct?'Right':'Wrong'}</span> <span class="mut">· answer ${esc(q.answer)}${r.yourAnswer&&!r.correct?`, you chose ${esc(r.yourAnswer)}`:''}</span></h3>${q.passage?`<p class="mut small">${rich(q.passage)}</p>`:''}<p>${rich(q.question)}</p>${q.statements?q.statements.map((s,j)=>`<p>(${j+1}) ${rich(s.replace(/^\s*\(?\d\)\s*/,''))}</p>`).join(''):''}${q.options.map((o,j)=>`<div class="small ${L[j]===q.answer?'ok':''}">${L[j]}. ${rich(o)}</div>`).join('')}${q.explanation?`<p class="mut">${rich(q.explanation)}</p>`:''}</div>`}).join('')}</details>
  <details><summary>Report JSON</summary><textarea id="rj" readonly style="min-height:200px"></textarea></details>
  </div>`;
  document.getElementById('rj').value=JSON.stringify(R);
  app.dataset.report=JSON.stringify(R);
  window.scrollTo(0,0);tex();
}

/* ---------- events ---------- */
app.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(act==='sample')loadData(SAMPLE);
  else if(act==='paste')loadData(document.getElementById('txt').value);
  else if(act==='start')start();
  else if(act==='resume'){if(Date.now()>=S.endAt)finish(true);else{if(S.phase==='test'||S.view==='q')S.qStart=S.qStart??Date.now();render();startTick()}}
  else if(act==='discard'){if(arm('discard',b,'Tap again to discard')){store.del(KEY);S=null;renderLoad()}}
  else if(act==='bm'){S.bookmarks[S.idx]=!S.bookmarks[S.idx];b.textContent=S.bookmarks[S.idx]?'★ Bookmarked':'☆ Bookmark';save()}
  else if(act==='next'){if(!S.answers[S.idx])return;stamp();if(S.idx<S.test.questions.length-1){S.idx++;S.qStart=Date.now()}else{S.phase='review';S.view='list';S.orig=S.answers.slice()}save();render()}
  else if(act==='open'){S.idx=+b.dataset.i;S.view='q';S.qStart=Date.now();save();render()}
  else if(act==='back'){stamp();S.view='list';save();render()}
  else if(act==='end'){if(arm('end',b,'Tap again to end the section'))finish(false)}
  else if(act==='home'){S=null;pending=null;renderLoad()}
  else if(act==='hist'){const h=(store.get(HIST)||[])[+b.dataset.i];if(h)renderResults(h.report,h.test)}
  else if(act==='copy'||act==='copyPrompt'){
    const txt=act==='copy'?app.dataset.report:document.getElementById('prompt').value;
    try{await navigator.clipboard.writeText(txt);b.textContent='Copied ✓'}catch(err){const t=document.getElementById(act==='copy'?'rj':'prompt');t.closest('details').open=true;t.focus();t.select();b.textContent='Select all & copy below'}
  }
  else if(act==='dl'){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(JSON.parse(app.dataset.report),null,2)],{type:'application/json'}));a.download='gmat-report.json';a.click()}catch(err){}}
  else if(act==='sort'){const tb=b.closest('table').tBodies[0],c=+b.dataset.c,rows=[...tb.rows],dir=b.dataset.d==='1'?-1:1;b.dataset.d=dir===1?'1':'0';const v=r=>{const s=r.cells[c]?.textContent||'',n=parseFloat(s.replace(/[^0-9.\-]/g,''));return isNaN(n)?s:n};rows.sort((x,y)=>{const a=v(x),bb=v(y);return(typeof a==='number'&&typeof bb==='number'?a-bb:String(a).localeCompare(String(bb)))*dir});rows.forEach(r=>tb.appendChild(r))}
});
hud.addEventListener('click',e=>{if(e.target.closest('[data-act=clock]')){hideClock=!hideClock;tick()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

if(S&&S.phase!=='done'){if(Date.now()>=S.endAt)finish(true);else{render();startTick()}}else renderLoad();
}
</script>
</body></html>
