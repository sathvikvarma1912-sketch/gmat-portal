<style>
/* VOICE: exam-room clinical — the screen you will sit in front of on test day.
   IDEA: the computer-based test driver: dark title bar with timer and counter, blue tool strip, white answer sheet, blue navigation bar.
   PICTURE: the live question itself; after the section, a score-report sheet.
   COLOUR and TYPE: slate #1d2733 title bar, exam blue #2b5f9e strips, white sheet on pale grey, coral only for time pressure; Arial/Helvetica like the test driver.
   LAYOUT: one column on phones; passage | question split from 900px; navigation bar fixed to the bottom. */
:root{color-scheme:light;--bg:#e9edf2;--sheet:#fff;--ink:#1b1f24;--mut:#5a6573;--line:#cfd6df;--soft:#f3f5f8;--top:#1d2733;--blue:#2b5f9e;--blue2:#1f4a7d;--pri:#2b5f9e;--ok:#1f7a45;--bad:#b3261e;--coral:#e8553f;--sel:#e6eff9}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Arial,Helvetica,sans-serif;overflow-x:clip}
h1,h2,h3{line-height:1.2;margin:0;font-weight:700}
h1{font-size:clamp(24px,4vw,30px)}h2{font-size:19px;margin:28px 0 10px}
.chrome{position:sticky;top:0;z-index:6}
.bar{background:var(--top);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px max(3vw,12px);min-height:54px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;letter-spacing:.02em}
#hud{display:flex;align-items:center;gap:20px;font-variant-numeric:tabular-nums}
.hi{display:flex;align-items:center;gap:8px}.hi svg{width:20px;height:20px;flex:none;opacity:.8}
.hi small{display:block;font-size:11px;color:#c3ccd7;line-height:1.1}
.clock{background:none;border:0;padding:0;min-height:0;color:#fff;font:700 17px Arial,Helvetica,sans-serif;cursor:pointer;white-space:nowrap}
.clock.warn{color:#ffb3a3}
.cnt{font-size:16px;font-weight:700;white-space:nowrap}
.sync{font-size:13px;color:#ffffffcc;white-space:nowrap;display:flex;align-items:center;gap:6px}.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:#ffffff66}
.sync[data-s=on]::before{background:#8fdc72}.sync[data-s=off]::before{background:var(--coral)}.sync[data-s=busy]::before{background:#e6f5c8}
.tool{background:var(--blue);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px max(3vw,12px);min-height:42px;font-size:14px;font-weight:700}
.tool[hidden]{display:none}
.tbtn{background:transparent;color:#fff;border:1px solid #ffffff66;border-radius:3px;min-height:34px;padding:0 12px;font:700 14px Arial,Helvetica,sans-serif;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.tbtn[aria-pressed=true]{background:#fff;color:var(--blue2)}.tbtn svg{width:15px;height:15px}
.wrap{max-width:1000px;margin:0 auto;padding:clamp(22px,4vw,40px) max(4vw,16px) 64px;background:var(--sheet);min-height:calc(100vh - 54px)}
.lede{color:var(--mut);margin:10px 0 22px;max-width:62ch}
.mut{color:var(--mut)}.small{font-size:14px}.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
button{font:inherit;min-height:44px;border-radius:3px;padding:0 18px;cursor:pointer;border:1px solid transparent}
button:focus-visible,label:has(input:focus-visible),textarea:focus-visible,tr:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.pri{background:var(--blue);color:#fff;font-weight:700;border-color:var(--blue2)}.pri:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:#fff;color:var(--ink);border-color:#aab4c1}
.link{background:none;border:0;padding:0;min-height:0;color:var(--blue);text-decoration:underline;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.drop{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;border:2px dashed #aab4c1;border-radius:4px;padding:28px;min-height:180px;text-align:center;cursor:pointer;background:var(--soft)}
.drop.over{border-color:var(--blue)}.drop input{position:absolute;opacity:0;width:1px;height:1px}
.paste{display:flex;flex-direction:column;gap:10px}
textarea{width:100%;min-height:130px;border:1px solid #aab4c1;border-radius:3px;padding:12px;font:14px/1.45 ui-monospace,Menlo,Consolas,monospace;background:#fff;color:var(--ink);resize:vertical}
.err{margin-top:16px;padding:12px 14px;border-radius:3px;background:#fdecea;color:var(--bad);font-weight:700;border:1px solid #f3c2bd}
.card{border:1px solid var(--line);border-radius:4px;padding:18px;margin-top:20px;background:#fff}
.resume{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;border-left:4px solid var(--blue)}.resume>div:first-child{display:flex;flex-direction:column}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{background:var(--soft);border:1px solid var(--line);border-radius:3px;padding:3px 10px;font-size:14px}
.rules{margin:12px 0 18px;padding-left:20px;color:var(--mut)}.rules li{margin:4px 0}
details{margin-top:20px}summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center;color:var(--blue)}
.hist,.lib{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.hrow{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 4px;color:var(--ink)}
.hrow:hover{background:var(--soft)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}
.lrow .row{justify-content:flex-end}.lrow button{min-height:40px;padding:0 14px}
@media(max-width:520px){.lrow{grid-template-columns:1fr}.lrow .row{justify-content:flex-start}}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:32px 0 12px}.sechead h2{margin:0}
/* question sheet */
.q{max-width:1240px;margin:0 auto;background:var(--sheet);min-height:calc(100vh - 96px);padding-bottom:96px}
.pane{padding:24px max(3vw,16px)}
.q:not(.split) .ask{max-width:820px;margin:0 auto}
.q.split{display:grid}
.stim{border-bottom:3px solid var(--line)}
@media(min-width:900px){.q.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.q.split .stim{border-bottom:0;border-right:3px solid var(--line);max-height:calc(100vh - 152px);overflow:auto;position:sticky;top:96px}}
.passage{font-size:16px;line-height:1.75}
.qtype{font-size:13px;color:var(--mut);margin-bottom:12px}
.stem{font-size:16px;line-height:1.65;margin-bottom:18px}
.stmts{list-style:none;padding:0;margin:0 0 18px}.stmts li{margin:8px 0;padding-left:2.4em;text-indent:-2.4em}
.opts{display:flex;flex-direction:column;gap:2px}
.opt{display:grid;grid-template-columns:22px 1fr;gap:12px;align-items:start;padding:10px;border-radius:3px;cursor:pointer;min-height:44px}
.opt:hover{background:var(--soft)}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid #6b7684;background:#fff;margin-top:1px;display:grid;place-items:center}
.opt.on{background:var(--sel)}.opt.on .rd{border-color:var(--blue)}.opt.on .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--blue)}
.opt.lock{opacity:.5;cursor:not-allowed}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--blue2);display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:8px max(3vw,12px) max(8px,env(safe-area-inset-bottom))}
.nav{background:var(--blue);color:#fff;border:1px solid #ffffff70;border-radius:3px;min-height:44px;padding:0 18px;font:700 15px Arial,Helvetica,sans-serif;display:inline-flex;align-items:center;gap:8px}
.nav:disabled{opacity:.45;cursor:not-allowed}.nav svg{width:14px;height:14px}
@media(max-width:480px){.foot{flex-wrap:nowrap}.foot .nav{flex:1 1 auto;justify-content:center;padding:0 10px;font-size:14px}.foot .note:empty{display:none}.brand{font-size:14px}}
.foot .note{color:#dbe5f1;font-size:14px}
.note{color:var(--mut);font-size:14px}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{font-weight:700;font-size:14px;color:var(--ink);background:#dfe5ec}
.dt th{cursor:pointer;white-space:nowrap}.dt caption{text-align:left;font-weight:700;margin-bottom:6px}
/* review & edit */
.rv{border:1px solid var(--line);margin:16px 0 8px}.rv td,.rv th{padding:10px 12px}
.rv tbody tr{cursor:pointer}.rv tbody tr:hover td,.rv tbody tr:focus-visible td{background:var(--sel)}
.rv .flag{color:var(--coral);font-weight:700}
/* dialogs */
.modal{position:fixed;inset:0;z-index:20;background:#0b1320a8;display:grid;place-items:center;padding:16px}
.dlg{background:#fff;max-width:460px;width:100%;border-radius:4px;overflow:hidden;box-shadow:0 14px 40px #0007}
.dlg h3{background:var(--top);color:#fff;font-size:16px;padding:12px 16px}
.dlg p{padding:16px 16px 4px;margin:0}
.dlg .row{justify-content:flex-end;padding:16px}
/* score report */
.score{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,48px);align-items:center;margin:16px 0 8px}
@media(max-width:600px){.score{grid-template-columns:1fr}}
.big{font-size:clamp(60px,13vw,104px);font-weight:700;line-height:1;color:var(--blue);font-variant-numeric:tabular-nums}.big small{font-size:.4em;color:var(--mut)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));border-top:1px solid var(--line)}
.figs div{padding:12px 12px 12px 0;border-bottom:1px solid var(--line)}.figs b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.figs span{font-size:14px;color:var(--mut)}
.bars{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:110px 1fr 120px;gap:12px;align-items:center;font-size:15px}
@media(max-width:600px){.brow{grid-template-columns:84px 1fr 92px;font-size:14px}}
.track{height:14px;background:var(--soft);border:1px solid var(--line);border-radius:2px;overflow:hidden}.fill{height:100%;background:var(--blue)}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.slow{color:var(--coral);font-weight:700}
.copybar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:24px 0 8px;padding:14px 16px;border-radius:4px;background:var(--soft);border:1px solid var(--line)}
.exp{border-top:1px solid var(--line);padding:14px 0}.exp h3{font-size:16px;margin:0 0 6px}
pre,.scroll{overflow-x:auto}code{overflow-wrap:anywhere}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mut)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.fill{transition:width .6s ease}}
</style><script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script></head><body>
<div class="chrome"><header class="bar"><div class="brand">GMAT Practice Room</div><div id="hud"></div></header><div class="tool" id="tool" hidden></div></div>
<div id="dlg"></div>
<main id="app"></main>
<template id="promptTpl">Act as my GMAT tutor. Give me 23 GMAT Focus–standard questions on: [TOPIC(S)]. Use real past-GMAT style (official-guide level). Mix difficulty: about 5 Easy, 9 Medium, 6 Hard, 3 Very Hard.
Return ONLY valid JSON (no commentary) in exactly this format:
{
  "title": "Quant – Number Properties + Rates",
  "section": "Quant",
  "timeLimitMinutes": 45,
  "questions": [
    {
      "id": "Q1",
      "type": "PS",
      "topic": "Number Properties",
      "subtopic": "Divisibility",
      "difficulty": "Medium",
      "passage": "",
      "question": "If \\( n^2 \\) is divisible by 72, ...",
      "statements": [],
      "options": ["6", "12", "24", "36", "48"],
      "answer": "B",
      "explanation": "Short worked solution."
    }
  ]
}
Rules: type is PS, DS, CR, RC or DI. "answer" is one letter A–E. DS questions: put the two statements in "statements" and leave "options" empty. RC and CR stimulus text goes in "passage". DI tables: add "table": {"headers": [...], "rows": [[...]]}. Write math as \\( ... \\) (double backslash inside JSON). Include a concise explanation for every question.</template>
<script>
{
const L='ABCDE';
const DS_OPTS=['Statement (1) ALONE is sufficient, but statement (2) alone is not sufficient.','Statement (2) ALONE is sufficient, but statement (1) alone is not sufficient.','BOTH statements TOGETHER are sufficient, but NEITHER statement ALONE is sufficient.','EACH statement ALONE is sufficient.','Statements (1) and (2) TOGETHER are NOT sufficient.'];
const TYPES={PS:'Problem Solving',DS:'Data Sufficiency',CR:'Critical Reasoning',RC:'Reading Comprehension',DI:'Data Insights',TA:'Table Analysis',GI:'Graphics Interpretation',MSR:'Multi-Source Reasoning',TPA:'Two-Part Analysis'};
const DIFF=['Easy','Medium','Hard','Very Hard'];
const KEY='gmat-room-session-v1',HIST='gmat-room-history-v1',TESTS='gmat-room-tests-v1';
const app=document.getElementById('app'),hud=document.getElementById('hud'),tool=document.getElementById('tool'),dlgBox=document.getElementById('dlg');
const ICON={clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>',
flag:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h2v18H5zM8 4h10l-2 4 2 4H8z"/></svg>',
next:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 4l10 8-10 8z"/></svg>',
prev:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 4L6 12l10 8z"/></svg>'};
function modal(title,body,buttons){return new Promise(res=>{dlgBox.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dlg"><h3>${esc(title)}</h3><p>${esc(body)}</p><div class="row">${buttons.map((b,i)=>`<button class="${i===buttons.length-1?'pri':'ghost'}" data-v="${i}">${esc(b)}</button>`).join('')}</div></div></div>`;const btns=dlgBox.querySelectorAll('button');btns[btns.length-1].focus();btns.forEach(b=>b.onclick=()=>{dlgBox.innerHTML='';res(+b.dataset.v)})})}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rich=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const fmt=sec=>{sec=Math.max(0,Math.round(sec));return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')};
const tex=()=>{try{window.MathJax&&MathJax.typesetPromise&&MathJax.typesetPromise([app]).catch(()=>{})}catch(e){}};
const armed={};
const arm=(k,btn,txt)=>{if(armed[k]&&Date.now()-armed[k]<4000){armed[k]=0;return true}armed[k]=Date.now();const o=btn.textContent;btn.textContent=txt;setTimeout(()=>{if(btn.isConnected)btn.textContent=o},4000);return false};
const SAMPLE={title:'Sample – mixed Quant & Verbal',section:'Mixed',timeLimitMinutes:10,questions:[
{id:'Q1',type:'PS',topic:'Number Properties',subtopic:'Divisibility',difficulty:'Medium',question:'If \\( n \\) is a positive integer and \\( n^2 \\) is divisible by 72, what is the largest positive integer that must divide \\( n \\)?',options:['6','12','24','36','48'],answer:'B',explanation:'\\( 72 = 2^3 \\cdot 3^2 \\). For \\( n^2 \\) to contain \\( 2^3 \\), \\( n \\) needs at least \\( 2^2 \\); for \\( 3^2 \\), \\( n \\) needs 3. So \\( n \\) must be a multiple of 12.'},
{id:'Q2',type:'DS',topic:'Algebra',subtopic:'Quadratics',difficulty:'Medium',question:'What is the value of \\( x \\)?',statements:['\\( x^2 - 5x + 6 = 0 \\)','\\( x \\) is a prime number greater than 2.'],answer:'C',explanation:'(1) gives x = 2 or 3: not sufficient. (2) allows any odd prime: not sufficient. Together x = 3.'},
{id:'Q3',type:'PS',topic:'Counting',subtopic:'Inclusion–exclusion',difficulty:'Hard',question:'How many positive integers less than 1,000 are divisible by neither 5 nor 7?',options:['672','685','686','700','714'],answer:'C',explanation:'Multiples of 5: 199; of 7: 142; of 35: 28. Divisible by 5 or 7: 199 + 142 − 28 = 313. Answer: 999 − 313 = 686.'},
{id:'Q4',type:'CR',topic:'Critical Reasoning',subtopic:'Weaken',difficulty:'Medium',passage:'After the town of Arden installed speed cameras along Main Street, the number of traffic accidents on Main Street fell by 30 percent over the following year. The town council concluded that the cameras caused the decline.',question:'Which of the following, if true, most seriously weakens the council\'s conclusion?',options:['Speed cameras are costly for the town to maintain.','In the same year, a newly opened bypass diverted most truck traffic away from Main Street.','Accident rates in nearby towns without speed cameras rose slightly that year.','Most Arden residents say they support the cameras.','The cameras were placed at the three intersections with the most accidents.'],answer:'B',explanation:'B offers an alternative cause for the decline, so the cameras need not be responsible.'},
{id:'Q5',type:'RC',topic:'Reading Comprehension',subtopic:'Inference',difficulty:'Hard',passage:'Most flowering plants release pollen passively, but some, such as the tomato, have anthers that release pollen only when vibrated at particular frequencies, a process known as buzz pollination. Honeybees cannot produce these vibrations; bumblebees can. Greenhouse tomato growers, who long relied on workers who vibrated each flower by hand with electric wands, began importing commercial bumblebee colonies in the late 1980s. The shift reduced labor costs substantially, although some ecologists warn that colonies escaping from greenhouses may compete with native pollinators.',question:'It can be inferred from the passage that, before the late 1980s, greenhouse tomato growers',options:['relied mainly on honeybees to pollinate their crops','spent money on labor to release pollen that the flowers would not otherwise release efficiently','did not know that tomato flowers require vibration to release pollen','imported native bumblebee species from other regions','were criticized by ecologists for their pollination methods'],answer:'B',explanation:'Growers paid workers to vibrate flowers by hand, and the switch to bumblebees cut labor costs.'}]};

let S=store.get(KEY),pending=null,timer=null,hideClock=false,ticks=0,view='load';
const save=()=>{if(S&&S.phase!=='done'){S.savedAt=Date.now();store.set(KEY,S)}};

/* ---------- ids, local library, history ---------- */
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return h.toString(36)};
const testId=t=>'t'+hash(JSON.stringify(t.questions.map(q=>[q.question,q.answer,q.options])));
const attemptId=r=>'a'+Date.parse(r.takenAt);
const getHist=()=>(store.get(HIST)||[]).map(h=>(h.id=h.id||attemptId(h.report),h.testId=h.testId||testId(h.test),h));
const getTests=()=>store.get(TESTS)||[];
const byNewest=(a,b)=>String(b.report.takenAt).localeCompare(String(a.report.takenAt));
const setHist=h=>store.set(HIST,h.sort(byNewest).slice(0,100));

/* ---------- cloud sync (Vercel function + private Blob store) ---------- */
let cloudOn=null;
const SYNC={on:'Synced',busy:'Syncing…',off:'This device only'};
function setSync(s){const el=document.getElementById('sync');if(el){el.textContent=SYNC[s];el.dataset.s=s}}
const syncPill=()=>`<span class="sync" id="sync" data-s="${cloudOn?'on':cloudOn===false?'off':'busy'}">${cloudOn?SYNC.on:cloudOn===false?SYNC.off:SYNC.busy}</span>`;
async function api(method,body,qs){
  const r=await fetch('/api/sync'+(qs||''),{method,headers:body?{'content-type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined,credentials:'same-origin',cache:'no-store'});
  const ct=r.headers.get('content-type')||'';
  if(!r.ok||!ct.includes('json'))throw Error('HTTP '+r.status);
  return r.json();
}
async function push(kind,id,data){
  if(cloudOn===false)return false;
  try{await api('POST',{kind,id,data});cloudOn=true;setSync('on');return true}catch(e){cloudOn=false;setSync('off');return false}
}
const drop=(kind,id)=>{if(cloudOn)api('DELETE',null,`?kind=${kind}&id=${encodeURIComponent(id||'x')}`).catch(()=>{})};
let sessT=null;
const pushSession=()=>{clearTimeout(sessT);sessT=setTimeout(()=>{if(S&&S.phase!=='done')push('session','current',S)},400)};
function saveTest(t){
  const id=testId(t),tests=getTests();
  if(tests.some(x=>x.id===id))return id;
  const entry={id,title:t.title,savedAt:new Date().toISOString(),test:t};
  tests.unshift(entry);store.set(TESTS,tests);push('test',id,entry);
  return id;
}
function mergeIn(data,{upload}){
  const hist=getHist(),tests=getTests();let added=0;
  for(const a of data.attempts||[]){if(!a||!a.report||!a.test)continue;a.id=a.id||attemptId(a.report);a.testId=a.testId||testId(a.test);if(!hist.some(h=>h.id===a.id)){hist.push(a);added++;if(upload)push('attempt',a.id,a)}}
  for(const t of data.tests||[]){if(!t||!t.test)continue;t.id=t.id||testId(t.test);if(!tests.some(x=>x.id===t.id)){tests.push(t);added++;if(upload)push('test',t.id,t)}}
  setHist(hist);store.set(TESTS,tests.sort((a,b)=>String(b.savedAt).localeCompare(String(a.savedAt))));
  return added;
}
async function pull(){
  setSync('busy');
  let d;
  try{d=await api('GET');cloudOn=true}catch(e){cloudOn=false;setSync('off');return}
  mergeIn(d,{upload:false});
  // back up anything that so far lives only on this device
  const cloudA=new Set(d.attempts.map(a=>a.id)),cloudT=new Set(d.tests.map(t=>t.id));
  getHist().filter(h=>!cloudA.has(h.id)).forEach(h=>push('attempt',h.id,h));
  getTests().filter(t=>!cloudT.has(t.id)).forEach(t=>push('test',t.id,t));
  // an unfinished section: keep whichever device touched it last
  const cs=d.session,localLive=S&&S.phase!=='done';
  if(localLive&&cloudA.has('a'+S.startAt)){S=null;store.del(KEY)}
  if(cs&&cs.phase&&cs.phase!=='done'&&!cloudA.has('a'+cs.startAt)&&(!S||S.phase==='done'||(cs.savedAt||0)>(S.savedAt||0))){S=cs;store.set(KEY,S)}
  else if(S&&S.phase!=='done'&&(!cs||(S.savedAt||0)>(cs.savedAt||0)))pushSession();
  setSync('on');
  if(view==='load')renderLoad();
}

function normalize(d){
  if(Array.isArray(d))d={questions:d};
  if(!d||!Array.isArray(d.questions)||!d.questions.length)throw Error('No "questions" array found in the JSON.');
  const qs=d.questions.map((q,i)=>{
    const type=String(q.type||'PS').toUpperCase();
    let st=Array.isArray(q.statements)&&q.statements.length?q.statements.map(String):null;
    let opts=Array.isArray(q.options||q.choices)&&(q.options||q.choices).length?(q.options||q.choices):null;
    if(!opts&&(type==='DS'||st))opts=DS_OPTS;
    if(!opts||opts.length<2)throw Error(`Question ${i+1}: needs an "options" array.`);
    opts=opts.slice(0,5).map(o=>String(o).replace(/^\s*\(?[A-E][\).:]\s+/,''));
    const ans=String(q.answer??q.correct??'').toUpperCase().replace(/[^A-E]/g,'').charAt(0);
    if(!ans||L.indexOf(ans)>=opts.length)throw Error(`Question ${i+1}: "answer" must be a letter A–${L[opts.length-1]}.`);
    return{id:String(q.id??`Q${i+1}`),type,topic:String(q.topic||''),subtopic:String(q.subtopic||''),difficulty:String(q.difficulty||'Medium'),source:String(q.source||''),passage:String(q.passage||q.stimulus||''),table:q.table&&Array.isArray(q.table.rows)?q.table:null,question:String(q.question||q.prompt||''),statements:st,options:opts,answer:ans,explanation:String(q.explanation||'')};
  });
  return{title:String(d.title||'GMAT practice set'),section:String(d.section||''),timeLimitMinutes:Math.max(1,+d.timeLimitMinutes||45),questions:qs};
}

function tableHTML(t){
  return`<div class="scroll"><table class="dt">${t.caption?`<caption>${esc(t.caption)}</caption>`:''}<thead><tr>${(t.headers||[]).map((h,i)=>`<th data-act="sort" data-c="${i}">${esc(h)} ↕</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function showErr(m){const e=document.getElementById('err');if(e){e.hidden=!m;e.textContent=m||'';if(m)e.scrollIntoView({block:'center'})}}
function loadData(raw){
  let d=raw;
  if(typeof raw==='string'){try{d=JSON.parse(raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,''))}catch(e){showErr('That isn’t valid JSON: '+e.message);return}}
  if(d&&!Array.isArray(d)&&!d.questions&&(Array.isArray(d.attempts)||Array.isArray(d.tests))){
    const n=mergeIn(d,{upload:true});renderLoad();
    showErr('');const p=document.getElementById('prev');p.innerHTML=`<div class="card">Imported ${n} new item${n===1?'':'s'}${cloudOn?' and synced them':''}.</div>`;return;
  }
  if(d&&d.app==='GMAT Practice Room'&&d.score&&Array.isArray(d.questions)){showErr('That’s a single report. Upload a history export (Export history) or a test JSON instead.');return}
  try{pending=normalize(d)}catch(e){pending=null;showErr(e.message);document.getElementById('prev').innerHTML='';return}
  showErr('');saveTest(pending);
  const t=pending,n=t.questions.length,c={},dc={};
  t.questions.forEach(q=>{c[q.type]=(c[q.type]||0)+1;dc[q.difficulty]=(dc[q.difficulty]||0)+1});
  const p=document.getElementById('prev');
  p.innerHTML=`<div class="card"><h2 style="margin:0 0 4px">${esc(t.title)}</h2><div class="mut">${esc(t.section)}${t.section?' · ':''}${n} questions · ${t.timeLimitMinutes} minutes · about ${fmt(t.timeLimitMinutes*60/n)} per question</div>
  <div class="chips">${Object.entries(c).map(([k,v])=>`<span class="chip">${esc(TYPES[k]||k)} × ${v}</span>`).join('')}${Object.entries(dc).map(([k,v])=>`<span class="chip">${esc(k)} × ${v}</span>`).join('')}</div>
  <ul class="rules"><li>You must answer each question to move on; you can’t go back during the section.</li><li>Bookmark anything you want to revisit. After the last question you can review and change up to 3 answers.</li><li>The clock keeps running if you leave the page or switch devices. At 0:00 the section ends and unanswered questions count as wrong.</li></ul>
  <button class="pri" data-act="start">Start the ${t.timeLimitMinutes}-minute section</button></div>`;
  p.scrollIntoView({behavior:'smooth',block:'start'});
}
function start(){
  const now=Date.now(),n=pending.questions.length;
  S={test:pending,idx:0,phase:'test',view:'q',answers:Array(n).fill(null),times:Array(n).fill(0),bookmarks:Array(n).fill(false),orig:null,startAt:now,endAt:now+pending.timeLimitMinutes*60000,qStart:now};
  pending=null;save();pushSession();render();startTick();
}
function exportHistory(btn){
  const data={app:'GMAT Practice Room',kind:'history',version:1,exportedAt:new Date().toISOString(),tests:getTests(),attempts:getHist()};
  const txt=JSON.stringify(data);
  if(window.self===window.top){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=`gmat-history-${new Date().toLocaleDateString('en-CA')}.json`;document.body.appendChild(a);a.click();a.remove();btn.textContent='Downloaded ✓';return}catch(e){}}
  const box=document.getElementById('exp'),ta=document.getElementById('expTxt');box.hidden=false;ta.value=txt;ta.focus();ta.select();btn.textContent='Copy the text below';
}

/* ---------- clock ---------- */
function startTick(){stopTick();timer=setInterval(tick,500);tick()}
function stopTick(){if(timer)clearInterval(timer);timer=null}
function tick(){
  if(!S||S.phase==='done')return stopTick();
  const rem=(S.endAt-Date.now())/1000;
  if(rem<=0){finish(true);modal('Time Expired','Time for this section has expired. Your answers have been recorded.',['OK']);return}
  if(rem<300&&!S.warned5){S.warned5=true;save();modal('5 Minutes Remaining','You have 5 minutes left to complete this section.',['OK'])}
  const c=document.getElementById('clock');
  if(c){c.textContent=hideClock?'Show time':fmt(rem);c.classList.toggle('warn',rem<300&&!hideClock)}
  if(++ticks%10===0)save();
}
function stamp(){if(S.qStart!=null)S.times[S.idx]+=(Date.now()-S.qStart)/1000;S.qStart=null}

/* ---------- test ---------- */
function render(){
  if(!S||S.phase==='done')return renderLoad();
  view='test';const n=S.test.questions.length,list=S.phase==='review'&&S.view==='list';
  hud.innerHTML=`<div class="hi">${ICON.clock}<div><small>Time Remaining</small><button class="clock" id="clock" data-act="clock" aria-label="Time remaining, tap to hide"></button></div></div><div class="hi">${ICON.list}<span class="cnt">${list?'Review':`${S.idx+1} of ${n}`}</span></div>`;
  tool.hidden=false;
  tool.innerHTML=`<span>${esc(S.test.section||S.test.title)}${S.phase==='review'?' · Review &amp; Edit':''}</span>${list?'':`<button class="tbtn" data-act="bm" aria-pressed="${!!S.bookmarks[S.idx]}">${ICON.flag}Bookmark for Review</button>`}`;
  if(S.phase==='review'&&S.view==='list')renderReview();else renderQ();
  tick();window.scrollTo(0,0);
}
const edits=()=>S.orig?S.answers.filter((a,i)=>a!==S.orig[i]).length:0;
function renderQ(){
  const q=S.test.questions[S.idx],a=S.answers[S.idx],n=S.test.questions.length,rev=S.phase==='review';

  app.innerHTML=`<div class="q ${stim?'split':''}">
  ${stim?`<section class="stim pane">${q.passage?`<div class="passage">${rich(q.passage)}</div>`:''}${q.table?tableHTML(q.table):''}</section>`:''}
  <section class="ask pane"><div class="qtype">${esc(TYPES[q.type]||q.type)}</div>
  <div class="stem">${rich(q.question)}</div>
  ${q.statements?`<ol class="stmts">${q.statements.map((s,i)=>`<li><b>(${i+1})</b>&nbsp; ${rich(s.replace(/^\s*\(?\d\)\s*/,''))}</li>`).join('')}</ol>`:''}
  <div class="opts" role="radiogroup">${q.options.map((o,i)=>`<label class="opt ${a===L[i]?'on':''} ${locked&&a!==L[i]?'lock':''}"><input type="radio" name="o" value="${L[i]}" ${a===L[i]?'checked':''} ${locked&&a!==L[i]?'disabled':''}><span class="rd"></span><span>${rich(o)}</span></label>`).join('')}</div>
  </section></div>
  <div class="foot">${rev?`<span class="note">${locked?'You’ve used all 3 edits':`${3-edits()} of 3 answer edits left`}</span><button class="nav" data-act="back">${ICON.list}Review &amp; Edit</button>`
  :`<span class="note">${a?'':'Select an answer to continue'}</span><button class="nav" id="next" data-act="next" ${a?'':'disabled'}>Next ${ICON.next}</button>`}</div>`;

    S.answers[S.idx]=r.value;save();

    if(rev)renderQ();else{document.getElementById('next').disabled=false;const nt=app.querySelector('.foot .note');if(nt)nt.textContent=''}
  }));

function renderReview(){
  const qs=S.test.questions;

  <table class="rv"><thead><tr><th>Question</th><th>Bookmarked</th><th>Status</th></tr></thead><tbody>${qs.map((q,i)=>`<tr data-act="open" data-i="${i}" tabindex="0"><td>${i+1}</td><td class="flag">${S.bookmarks[i]?ICON.flag.replace('<svg','<svg width="15" height="15"'):''}</td><td>${S.answers[i]?'Answered':'Incomplete'}${S.answers[i]!==S.orig[i]?' <span class="mut">(edited)</span>':''}</td></tr>`).join('')}</tbody></table></div>

function finish(timedOut){
  stopTick();stamp();
  S.phase='done';S.finishedAt=Math.min(Date.now(),S.endAt);S.timedOut=!!timedOut;
  const report=buildReport();
  const entry={id:'a'+S.startAt,testId:testId(S.test),report,test:S.test};
  const hist=getHist().filter(h=>h.id!==entry.id);hist.unshift(entry);setHist(hist);store.del(KEY);
  clearTimeout(sessT);push('attempt',entry.id,entry).then(ok=>{if(ok)drop('session','current')});
  view='results';renderResults(report,S.test);
}

/* ---------- report ---------- */
function buildReport(){
  const qs=S.test.questions,n=qs.length,limit=S.test.timeLimitMinutes*60;
  const rows=qs.map((q,i)=>({n:i+1,id:q.id,type:q.type,topic:q.topic,subtopic:q.subtopic,difficulty:q.difficulty,yourAnswer:S.answers[i],correctAnswer:q.answer,correct:S.answers[i]===q.answer,timeSec:Math.round(S.times[i]),bookmarked:S.bookmarks[i],changedInReview:!!(S.orig&&S.answers[i]!==S.orig[i])}));
  const group=k=>{const g={};rows.forEach(r=>{const key=r[k]||'Other';g[key]=g[key]||{total:0,correct:0,timeSec:0};g[key].total++;g[key].correct+=r.correct?1:0;g[key].timeSec+=r.timeSec});for(const v of Object.values(g)){v.accuracy=Math.round(100*v.correct/v.total);v.avgTimeSec=Math.round(v.timeSec/v.total)}return g};
  const correct=rows.filter(r=>r.correct).length;
  return{app:'GMAT Practice Room',version:1,title:S.test.title,section:S.test.section,takenAt:new Date(S.startAt).toISOString(),timeLimitSec:limit,timeUsedSec:Math.round((S.finishedAt-S.startAt)/1000),timedOut:S.timedOut,targetPaceSec:Math.round(limit/n),answered:rows.filter(r=>r.yourAnswer).length,score:{correct,total:n,accuracy:Math.round(100*correct/n)},byDifficulty:group('difficulty'),byType:group('type'),byTopic:group('topic'),questions:rows};
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act;
  if(act==='sample')loadData(SAMPLE);
  else if(act==='paste')loadData(document.getElementById('txt').value);
  else if(act==='start')start();
  else if(act==='resume'){if(Date.now()>=S.endAt)finish(true);else{if(S.phase==='test'||S.view==='q')S.qStart=S.qStart??Date.now();render();startTick()}}
  else if(act==='discard'){if(arm('discard',b,'Tap again to discard')){store.del(KEY);S=null;drop('session','current');renderLoad()}}
  else if(act==='bm'){S.bookmarks[S.idx]=!S.bookmarks[S.idx];b.setAttribute('aria-pressed',S.bookmarks[S.idx]);save()}
  else if(act==='rvbm'){const i=S.bookmarks.findIndex(Boolean);if(i>=0){S.idx=i;S.view='q';S.qStart=Date.now();save();pushSession();render()}}
  else if(act==='next'){if(!S.answers[S.idx])return;stamp();if(S.idx<S.test.questions.length-1){S.idx++;S.qStart=Date.now()}else{S.phase='review';S.view='list';S.orig=S.answers.slice()}save();pushSession();render()}
  else if(act==='open'){S.idx=+b.dataset.i;S.view='q';S.qStart=Date.now();save();pushSession();render()}
  else if(act==='back'){stamp();S.view='list';save();pushSession();render()}
  else if(act==='end'){modal('End Section Review','Are you sure you want to end this section? You won’t be able to change any more answers.',['No','Yes']).then(v=>{if(v===1&&S&&S.phase!=='done')finish(false)})}
  else if(act==='home'){S=null;pending=null;renderLoad();pull()}
  else if(act==='hist'){const h=getHist().find(x=>x.id===b.dataset.id);if(h){view='results';renderResults(h.report,h.test)}}
  else if(act==='take'){const t=getTests()[+b.dataset.i];if(t)loadData(t.test)}
  else if(act==='rmtest'){if(arm('rm'+b.dataset.i,b,'Tap again to remove')){const ts=getTests(),t=ts.splice(+b.dataset.i,1)[0];store.set(TESTS,ts);if(t)drop('test',t.id);renderLoad()}}
  else if(act==='export')exportHistory(b);
  else if(act==='copy'||act==='copyPrompt'){
    const txt=act==='copy'?app.dataset.report:document.getElementById('prompt').value;
    try{await navigator.clipboard.writeText(txt);b.textContent='Copied ✓'}catch(err){const t=document.getElementById(act==='copy'?'rj':'prompt');t.closest('details').open=true;t.focus();t.select();b.textContent='Select all & copy below'}
  }
  else if(act==='dl'){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(JSON.parse(app.dataset.report),null,2)],{type:'application/json'}));a.download='gmat-report.json';a.click()}catch(err){}}
  else if(act==='sort'){const tb=b.closest('table').tBodies[0],c=+b.dataset.c,rows=[...tb.rows],dir=b.dataset.d==='1'?-1:1;b.dataset.d=dir===1?'1':'0';const v=r=>{const s=r.cells[c]?.textContent||'',n=parseFloat(s.replace(/[^0-9.\-]/g,''));return isNaN(n)?s:n};rows.sort((x,y)=>{const a=v(x),bb=v(y);return(typeof a==='number'&&typeof bb==='number'?a-bb:String(a).localeCompare(String(bb)))*dir});rows.forEach(r=>tb.appendChild(r))}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-act]'))e.target.click()});
hud.addEventListener('click',e=>{if(e.target.closest('[data-act=clock]')){hideClock=!hideClock;tick()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(S&&S.phase!=='done')push('session','current',S)}else if(view==='load')pull()});

renderLoad();
pull().then(()=>{if(view==='load'&&S&&S.phase!=='done'&&Date.now()>=S.endAt)finish(true)});
}
</script>
</body></html>
